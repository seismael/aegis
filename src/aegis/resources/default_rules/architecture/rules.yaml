# Aegis Boundaries Rule Pack
# Enforces DDD layer isolation, module boundaries, and architectural invariants
# that no linter can detect — graph-based cross-file analysis.

rules:

  - id: arch-layer-violation
    description: Domain layer must not import infrastructure, application, or framework modules.
    engine_type: graph
    severity: HIGH
    mode: block
    query: disallowed_import
    applies_to:
      - "**/domain/**"
    metadata:
      source: domain
      target: infrastructure
    rationale: |
      Layered architecture requires domain purity. Infrastructure concerns (database,
      HTTP, email) leaking into domain creates tight coupling to technical details that
      change independently of business logic. Use ports/interfaces in domain and
      implement in infrastructure.

  - id: arch-circular-import
    description: Modules must not form circular dependency cycles.
    engine_type: graph
    severity: HIGH
    mode: block
    query: circular_dependency
    rationale: |
      Circular dependencies create tight coupling that prevents independent testing
      and produces import-time side effects. Refactor with dependency inversion:
      move shared abstractions to a separate module, or use interfaces.

  - id: arch-module-boundary
    description: Private module members (leading underscore) must not be imported across package boundaries.
    engine_type: graph
    severity: MEDIUM
    mode: warn
    rationale: |
      Private members are implementation details. Importing them across packages
      creates hidden coupling that breaks when the implementation changes. The
      owning package should expose a public API contract.

  - id: arch-aggregate-root
    description: Aggregate roots should be the sole entry point for modifications. Entities should not expose public mutators outside their aggregate boundary.
    engine_type: semantic
    severity: HIGH
    mode: warn
    rationale: |
      DDD aggregate pattern: an aggregate root ensures invariants for its entire
      cluster. Bypassing the root to mutate child entities directly breaks
      transactional consistency and business rule enforcement.

  - id: arch-public-api-change
    description: Changes to public API signatures must be reviewed.
    engine_type: graph
    severity: MEDIUM
    mode: warn
    applies_to:
      - "**/__init__.py"
    query: public_api_diff
    rationale: |
      Public API changes (renamed functions, changed signatures, removed exports)
      break downstream consumers. The graph analyzer tracks __all__ and exported
      symbols to flag breaking changes.
