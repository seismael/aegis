# Aegis Security Rule Pack
# Zero-tolerance security policies. All rules are CRITICAL/HIGH, mode: block.
# These prevent actual security breaches — not style preferences.

rules:

  - id: sec-hardcoded-credentials
    description: Hardcoded credentials detected in source code.
    engine_type: regex
    severity: CRITICAL
    mode: block
    query: (?i)(password|passwd|pwd|secret|api[_-]?key|token|bearer|jwt)\s*[=:]\s*["'][^"']{3,}["']
    rationale: |
      Credentials in source code are exposed to everyone with repository access,
      including past and future employees. Use environment variables, a secrets
      manager (AWS Secrets Manager, HashiCorp Vault), or a .env file excluded from
      version control.

  - id: sec-eval-exec
    description: eval(), exec(), and compile() introduce arbitrary code execution risk.
    engine_type: regex
    severity: CRITICAL
    mode: block
    query: (?<!re\.)\b(?:eval|exec|compile)\s*\(
    rationale: |
      Dynamic code execution allows arbitrary Python to run. Even with input
      validation, eval() is notoriously difficult to secure. Use ast.literal_eval()
      for data parsing, or design explicit parsers for specific formats.

  - id: sec-sql-injection
    description: SQL queries built via string concatenation or formatting enable injection attacks.
    engine_type: regex
    severity: CRITICAL
    mode: block
    query: (?:execute|query|cursor)\s*\(\s*(?:["'][^"']*\+|["'][^"']*%|f["'])
    rationale: |
      String building in SQL queries allows attackers to inject arbitrary SQL.
      Always use parameterized queries (cursor.execute("...", (param,))) or
      ORM query builders. Never concatenate user input into SQL strings.

  - id: sec-insecure-deserialization
    description: pickle.load/loads or yaml.load without SafeLoader enables arbitrary code execution.
    engine_type: regex
    severity: CRITICAL
    mode: block
    query: \b(?:pickle\.(?:loads|load)|yaml\.load\s*\((?!.*SafeLoader))\b
    rationale: |
      Insecure deserialization is one of the OWASP Top 10. pickle can execute
      arbitrary Python during unpickling. yaml.load() (without SafeLoader) can
      construct arbitrary Python objects. Use yaml.safe_load() or json instead.

  - id: sec-exposed-connections
    description: Database connection strings, AWS keys, or private keys in source code.
    engine_type: regex
    severity: CRITICAL
    mode: block
    query: (?i)(?:postgres(?:ql)?|mysql|mongodb|redis)://[^@]+@|AKIA[0-9A-Z]{16}|-----BEGIN (?:RSA |EC )?PRIVATE KEY-----
    rationale: |
      Connection strings with embedded credentials grant direct data access.
      AWS access keys grant cloud infrastructure access. Private keys compromise
      encryption and authentication. All belong in environment variables or secrets
      management, never in source.

  - id: sec-weak-hashing
    description: MD5 or SHA1 used for password hashing or security purposes.
    engine_type: regex
    severity: HIGH
    mode: block
    query: \b(?:hashlib\.(?:md5|sha1)|crypt\.(?:md5|sha1))\b
    rationale: |
      MD5 and SHA1 are cryptographically broken and unsuitable for password
      hashing. Use bcrypt, argon2, or PBKDF2 for passwords. MD5 is acceptable
      only for non-security purposes like checksums or data deduplication.
