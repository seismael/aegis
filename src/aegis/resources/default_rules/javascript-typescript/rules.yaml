# Aegis TypeScript Rule Pack
# TypeScript/JavaScript quality and safety rules.

rules:

  - id: ts-no-console-log
    description: console.log should not be used in production TypeScript code.
    engine_type: regex
    severity: MEDIUM
    mode: warn
    query: console\.(?:log|debug|info)\s*\(
    excludes:
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "**/*.spec.ts"
      - "**/*.spec.tsx"
    rationale: |
      console.log output is unstructured and leaks to production builds.
      Use a logging library or remove before committing.

  - id: ts-no-any
    description: The 'any' type bypasses TypeScript type safety.
    engine_type: tree-sitter
    severity: HIGH
    mode: warn
    query: any_type_usage
    rationale: |
      Explicit 'any' annotations defeat TypeScript's type system. Use
      'unknown' for truly unknown types, proper interfaces for known
      shapes, or 'Record' for generic key-value structures.

  - id: ts-async-error-handling
    description: Async operations must handle errors explicitly.
    engine_type: tree-sitter
    severity: HIGH
    mode: warn
    query: await_without_try_catch
    rationale: |
      Unhandled promise rejections crash Node.js processes. Every await
      call should be wrapped in try/catch or have a .catch() handler.

  - id: ts-effect-cleanup
    description: useEffect hooks with side effects must include cleanup.
    engine_type: tree-sitter
    severity: MEDIUM
    mode: warn
    query: effect_without_cleanup
    rationale: |
      Missing cleanup functions cause memory leaks, stale event listeners,
      and race conditions on component unmount or re-render.

  - id: ts-explicit-return-types
    description: Exported functions should have explicit return type annotations.
    engine_type: tree-sitter
    severity: LOW
    mode: report
    query: exported_function_without_return_type
    rationale: |
      Explicit return types serve as documentation and prevent accidental
      type widening. The compiler infers types but humans don't.
