# Aegis Patterns Rule Pack
# Prevents real, measurable bugs — not style preferences.
# Focused on patterns that cause runtime errors or silent data corruption.

rules:

  - id: bp-mutable-defaults
    description: Mutable default arguments cause shared-state bugs across function calls.
    engine_type: regex
    severity: HIGH
    mode: warn
    query: def \w+\(.*=\s*(?:\[\s*\]|\{\s*\}|set\s*\(\s*\)|dict\s*\(\s*\))
    rationale: |
      Default arguments are evaluated once at definition time. Every call shares
      the same object, accumulating mutations across calls. Use None as default
      and initialize inside the function: `def f(items=None): items = items or []`.

  - id: bp-bare-except
    description: Bare except clauses catch unexpected errors and mask bugs.
    engine_type: regex
    severity: HIGH
    mode: warn
    query: "(?m)^\\s*except\\s*:"
    rationale: |
      Catching all exceptions silently hides bugs and makes debugging difficult.
      It also catches KeyboardInterrupt and SystemExit, preventing clean shutdown.
      Always specify the exception type: `except ValueError:`.

  - id: bp-public-api-untested
    description: Public functions in __all__ or exported APIs must have corresponding tests.
    engine_type: graph
    severity: MEDIUM
    mode: warn
    query: public_api_coverage
    rationale: |
      Public API without tests invites regression. The graph analyzer traces
      __all__ declarations to test files and flags uncovered exports.

  - id: bp-side-effect-import
    description: Module-level I/O, network calls, or state mutation on import.
    engine_type: regex
    severity: HIGH
    mode: warn
    query: (?m)^(?:print|open|requests\.|urllib)\(
    rationale: |
      Side effects on import prevent the module from being safely imported in all
      contexts (testing, documentation generation, type checking). Import-time I/O
      also makes startup time unpredictable and errors hard to trace.

  - id: bp-no-output-in-prod
    description: print() statements should use structured logging in production code.
    engine_type: regex
    severity: MEDIUM
    mode: warn
    query: (?m)(?<!#.*)\bprint\s*\(
    applies_to:
      - "**/*.py"
    excludes:
      - "**/test_*.py"
      - "**/tests/**"
      - "**/conftest.py"
    rationale: |
      print() output is unstructured, has no severity levels, and cannot be
      routed to aggregators. Use structlog or logging for production observability.
      print() is acceptable in test files and scripts.
