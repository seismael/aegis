# Aegis Documentation Rule Pack
# Docstring coverage and quality on public API surfaces.

rules:

  - id: doc-public-api
    description: Functions and classes in __all__ or public modules must have docstrings.
    engine_type: tree-sitter
    severity: MEDIUM
    mode: warn
    applies_to:
      - "**/__init__.py"
    query: public_api_missing_docstring
    rationale: |
      Public API without documentation requires consumers to read source code.
      Docstrings serve as in-IDE documentation and enable auto-generated reference
      docs.

  - id: doc-raises
    description: Functions raising exceptions should document them with :raises:.
    engine_type: regex
    severity: LOW
    mode: report
    query: (?m)raise\s+\w+
    rationale: |
      Undocumented exceptions surprise callers. The :raises: field documents
      expected error conditions and helps callers write correct error handling.

  - id: doc-examples
    description: Complex public functions benefit from usage examples in docstrings.
    engine_type: semantic
    severity: LOW
    mode: report
    query: missing_examples
    rationale: |
      Examples demonstrate intended usage patterns. They serve as lightweight
      tests and reduce onboarding time for new contributors.

  - id: doc-returns
    description: Functions returning values should document return types with :returns:.
    engine_type: tree-sitter
    severity: LOW
    mode: report
    query: missing_return_doc
    rationale: |
      Undocumented return values force callers to read implementation. The
      :returns: field documents the type and meaning of returned values.
