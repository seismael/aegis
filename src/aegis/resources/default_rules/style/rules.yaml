# Aegis Style Rule Pack
# Naming conventions, formatting consistency.

rules:

  - id: style-class-naming
    description: Classes must use PascalCase naming.
    engine_type: regex
    severity: MEDIUM
    mode: warn
    query: "(?m)^class\\s+([a-z][a-zA-Z0-9]*):"
    rationale: |
      PascalCase classes are a Python convention (PEP 8). Lowercase class names
      are indistinguishable from function calls at the usage site.

  - id: style-function-naming
    description: Functions must use snake_case naming.
    engine_type: regex
    severity: MEDIUM
    mode: warn
    query: (?m)^(?:(?:async\s+)?def\s+)([A-Z][a-zA-Z0-9]*)\s*\(
    rationale: |
      snake_case functions are a Python convention (PEP 8). CamelCase functions
      confuse readers who expect them to be classes.

  - id: style-constant-naming
    description: Module-level constants should use UPPER_CASE naming.
    engine_type: regex
    severity: LOW
    mode: report
    query: (?m)^(?!class\s)([A-Z][A-Z_0-9]+)\s*=\s*(?!\w+\s*\()
    rationale: |
      UPPER_CASE signals immutability intent. Constants at module level should
      follow this convention to distinguish from mutable module state.

  - id: style-no-debug-imports
    description: Debug tool imports should not be committed to production code.
    engine_type: regex
    severity: MEDIUM
    mode: warn
    query: (?m)^import (?:pdb|ipdb|icecream)\b|^from (?:pdb|ipdb|icecream)\b
    rationale: |
      Debug tools left in committed code can expose internals and break production
      when accidentally triggered. Use conditional imports or remove before commit.
