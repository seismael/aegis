# Aegis Testing Rule Pack
# Test structure, quality, and coverage enforcement.

rules:

  - id: test-no-sleep
    description: time.sleep in tests causes slow, flaky test suites.
    engine_type: regex
    severity: MEDIUM
    mode: warn
    applies_to:
      - "**/test_*.py"
      - "**/tests/**"
    query: time\.sleep\(
    rationale: |
      Real delays make test suites slow and unreliable. Use freezegun for
      time-dependent logic, or mock time.sleep directly.

  - id: test-parametrize
    description: Multiple similar assertions should use pytest.mark.parametrize.
    engine_type: tree-sitter
    severity: LOW
    mode: report
    applies_to:
      - "**/test_*.py"
      - "**/tests/**"
    rationale: |
      Parametrized tests reduce duplication and make test intent clearer.
      They also run as separate test cases with individual failure reporting.

  - id: test-explicit-mock
    description: Mock paths must reference the module under test, not the source module.
    engine_type: regex
    severity: MEDIUM
    mode: warn
    applies_to:
      - "**/test_*.py"
      - "**/tests/**"
    query: mock\.patch\s*\(\s*["']
    rationale: |
      Mock the import path where the object is USED, not where it's DEFINED.
      `patch('mymodule.requests.get')` not `patch('requests.get')`.

  - id: test-fixture-returns
    description: Pytest fixtures should have return type annotations for IDE support.
    engine_type: regex
    severity: LOW
    mode: report
    applies_to:
      - "**/conftest.py"
      - "**/tests/**" 
    query: (?m)^def \w+\(.*\)(?:\s*->\s*)?
    rationale: |
      Type-annotated fixtures improve IDE autocomplete and catch type errors
      in test setup code.

  - id: test-isolate-state
    description: Tests must not depend on execution order or shared mutable state.
    engine_type: semantic
    severity: MEDIUM
    mode: warn
    applies_to:
      - "**/test_*.py"
      - "**/tests/**"
    query: shared_state_detection
    rationale: |
      Module-level mutable state shared across test functions creates order-
      dependent failures that are hard to debug and reproduce.
