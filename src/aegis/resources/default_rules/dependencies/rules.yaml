# Aegis Dependencies Rule Pack
# Dependency health, license compliance, package management.

rules:

  - id: dep-unused
    description: Dependencies listed but never imported should be removed.
    engine_type: graph
    severity: MEDIUM
    mode: warn
    query: unused_dependency
    rationale: |
      Unused dependencies bloat install size, increase attack surface, and
      slow CI builds. The graph analyzer traces imports to verify every
      declared dependency is actually used.

  - id: dep-outdated
    description: Dependencies with known security vulnerabilities should be updated.
    engine_type: regex
    severity: HIGH
    mode: warn
    query: check_package_version
    rationale: |
      Outdated dependencies with CVE entries expose the project to known
      exploits. Regular updates are the cheapest security measure.

  - id: dep-pinned-version
    description: Production dependencies should use pinned versions, not ranges.
    engine_type: regex
    severity: MEDIUM
    mode: warn
    query: (?m)^[^#]*dependency.*[>~^]
    applies_to:
      - "**/pyproject.toml"
      - "**/package.json"
    rationale: |
      Version ranges (^1.0, ~2.3, >=3.0) produce non-reproducible builds.
      Pin exact versions with lock files for deterministic installations.

  - id: dep-direct-vs-transitive
    description: Importing a transitive dependency without declaring it is fragile.
    engine_type: graph
    severity: MEDIUM
    mode: warn
    query: transitive_dependency
    rationale: |
      Importing packages that aren't directly declared as dependencies relies
      on them being pulled in by another package. If that package changes its
      dependencies, your code breaks silently.

  - id: dep-license-compliance
    description: Dependencies with copyleft licenses (GPL, AGPL) may create legal obligations.
    engine_type: regex
    severity: LOW
    mode: report
    query: (?i)License.*GPL|License.*AGPL
    applies_to:
      - "**/LICENSE*"
      - "**/pyproject.toml"
    rationale: |
      Copyleft licenses require derivative works to be distributed under the
      same license terms. Review is required for commercial or proprietary use.

  - id: dep-circular-package
    description: Packages must not declare circular dependency relationships.
    engine_type: graph
    severity: HIGH
    mode: block
    query: package_dependency_cycle
    rationale: |
      Circular package dependencies create unresolvable installation orders
      and indicate tightly coupled packages that should be refactored into
      a single package or have the shared logic extracted.
